name: Build

# Builds the double-click program for Windows and Linux. Push a tag like v1.0.0 to also publish a release with both downloads;
# "Run workflow" (Actions tab) only builds them and keeps them as artifacts for a week.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pip install -r requirements.txt pyinstaller
      - if: runner.os == 'Windows'
        run: python packaging/fetch_astcenc.py
      - run: pyinstaller packaging/adust2manager.spec --distpath dist-app --workpath build --noconfirm
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path dist-app/ADust2Manager -DestinationPath ADust2Manager-${{ matrix.name }}.zip
        shell: pwsh
      - if: runner.os == 'Linux'
        run: tar -C dist-app -czf ADust2Manager-${{ matrix.name }}.tar.gz ADust2Manager
      - uses: actions/upload-artifact@v4
        with:
          name: ADust2Manager-${{ matrix.name }}
          path: ADust2Manager-${{ matrix.name }}.*
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      # The notes of a release are written in .github/release-notes/<tag>.md; without that file GitHub lists the commits instead.
      - run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then flags=(--notes-file "$notes"); else flags=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "${flags[@]}"
        env: { GH_TOKEN: "${{ github.token }}" }
